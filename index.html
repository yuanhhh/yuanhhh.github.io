<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Yuanhui 的个人工具站">
  <title>Yuanhui · Tools</title>
  <style>
    :root { --ink: #18213d; --muted: #6d7490; --violet: #6558ef; --sky: #dbeaff; --line: #e5e8f4; }
    * { box-sizing: border-box; }
    body { min-width: 320px; margin: 0; color: var(--ink); background: #fbfcff; font-family: "Nunito Sans", "Arial Rounded MT Bold", "PingFang SC", "Microsoft YaHei", sans-serif; }
    main { width: min(1040px, calc(100% - 40px)); margin: 0 auto; padding: 28px 0 72px; }
    nav { display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -.03em; }
    .mark { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 12px; color: #fff; background: linear-gradient(135deg, #8174ff, #4c8cff); box-shadow: 0 8px 18px #7589ff4d; }
    .meta { color: var(--muted); font-size: .87rem; font-weight: 700; }
    .hero { position: relative; overflow: hidden; margin-top: 52px; padding: clamp(38px, 7vw, 80px); border: 1px solid #e3e7fb; border-radius: 34px; background: linear-gradient(135deg, #f2f0ff 0%, #edf7ff 58%, #fff7ee 100%); }
    .hero::after { position: absolute; right: -86px; bottom: -135px; width: 340px; height: 340px; border: 58px solid #fff9; border-radius: 50%; content: ""; }
    .eyebrow { margin: 0 0 14px; color: #5d53d7; font-size: .78rem; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; }
    h1 { max-width: 720px; margin: 0; font-size: clamp(2.45rem, 7vw, 5.7rem); line-height: .98; letter-spacing: -.07em; }
    .hero p:not(.eyebrow) { max-width: 520px; margin: 22px 0 0; color: #56617d; font-size: 1.1rem; line-height: 1.75; }
    .tools { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-top: 24px; }
    .tool { display: flex; min-height: 230px; flex-direction: column; justify-content: space-between; padding: 27px; border: 1px solid var(--line); border-radius: 25px; color: inherit; background: #fff; box-shadow: 0 12px 30px #202e6910; text-decoration: none; transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease; }
    .tool:hover { border-color: #b7b1ff; box-shadow: 0 20px 40px #5648bb20; transform: translateY(-4px); }
    .tool-icon { display: grid; width: 47px; height: 47px; place-items: center; border-radius: 16px; color: #fff; background: linear-gradient(135deg, #796cff, #3e8cff); font-size: 1.4rem; }
    .tool h2 { margin: 24px 0 7px; font-size: 1.45rem; letter-spacing: -.04em; }
    .tool p { margin: 0; color: var(--muted); line-height: 1.65; }
    .go { margin-top: 24px; color: var(--violet); font-size: .92rem; font-weight: 900; }
    footer { margin-top: 44px; color: #9299b0; font-size: .82rem; text-align: center; }
    @media (max-width: 620px) { main { width: min(100% - 28px, 1040px); } .hero { margin-top: 32px; border-radius: 25px; } .tools { grid-template-columns: 1fr; } .meta { display: none; } }
  </style>
</head>
<body>
  <main>
    <nav><div class="brand"><span class="mark">Y</span><span>Yuanhui</span></div><span class="meta">Personal tools &amp; experiments</span></nav>
    <section class="hero">
      <p class="eyebrow">A small, useful corner of the web</p>
      <h1>少一点杂乱，<br>多一点发现。</h1>
      <p>这里放置正在使用的轻量工具。每个工具独立运行，直接解决一个具体问题。</p>
    </section>
    <section class="tools" aria-label="工具列表">
      <a class="tool" href="/stock-similarity/">
        <div><div class="tool-icon">⌁</div><h2>股票走势相似度</h2><p>用 K 线、均线、成交量与技术指标寻找近期或历史相似走势。</p></div>
        <span class="go">打开工具 →</span>
      </a>
    </section>
    <footer>Built for focused exploration.</footer>
  </main>
</body>
</html>
