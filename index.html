<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Yuanhui 的个人工具">
  <meta name="theme-color" content="#f6f5ef">
  <title>Yuanhui · 个人空间</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f6f5ef;
      --ink: #1d2924;
      --line: #dedfd6;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 3px solid #d47949; outline-offset: 5px; }
    .wrap { display: flex; width: min(1120px, calc(100% - 64px)); min-height: 100vh; flex-direction: column; margin: 0 auto; }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 92px;
      border-bottom: 1px solid var(--line);
    }
    .brand { display: inline-flex; align-items: center; gap: 11px; font-size: 15px; font-weight: 750; letter-spacing: -.03em; }
    .brand-mark {
      display: grid;
      width: 35px;
      height: 35px;
      place-items: center;
      border-radius: 50%;
      color: #f6f5ef;
      background: var(--ink);
      font-family: Georgia, serif;
      font-size: 19px;
      font-style: italic;
      font-weight: 400;
    }
    .nav { display: flex; align-items: center; gap: 32px; color: #626d65; font-size: 13px; font-weight: 600; }
    .nav a:hover { color: #d06e3f; }
    main { display: flex; flex: 1; flex-direction: column; justify-content: center; padding: 70px 0; }
    .section-kicker, .card-number, .card-type {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .section-heading { display: flex; align-items: end; justify-content: space-between; margin-bottom: 18px; }
    .section-heading h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -.04em; }
    .section-kicker { color: #929b91; }
    .tools { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .tool {
      position: relative;
      display: flex;
      min-height: 280px;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      padding: 27px 30px 28px;
      border-radius: 16px;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .tool:hover { transform: translateY(-4px); box-shadow: 0 18px 30px #26392b20; }
    .tool-dark { color: #f4f4e8; background: #254a39; }
    .tool-light { color: #3b3b2e; background: #e9e4d4; }
    .card-top, .card-bottom { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; }
    .card-number { opacity: .58; }
    .card-type { opacity: .7; }
    .tool h2 { position: relative; z-index: 1; margin: 0 0 8px; font-size: clamp(22px, 2.3vw, 28px); font-weight: 650; letter-spacing: -.05em; }
    .tool p { position: relative; z-index: 1; margin: 0; font-size: 13px; opacity: .7; }
    .arrow { display: grid; width: 38px; height: 38px; flex: none; place-items: center; border: 1px solid currentColor; border-radius: 50%; font-size: 19px; line-height: 1; transition: transform .2s ease; }
    .tool:hover .arrow { transform: rotate(45deg); }
    .card-art { position: absolute; top: 44px; right: 6%; width: 43%; height: 135px; opacity: .8; }
    footer { display: flex; justify-content: space-between; padding: 25px 0 36px; border-top: 1px solid var(--line); color: #a0a69e; font-size: 11px; letter-spacing: .04em; }
    @media (max-width: 700px) {
      .wrap { width: calc(100% - 40px); }
      .header { min-height: 76px; }
      .nav { gap: 22px; }
      main { padding: 52px 0; }
      .tools { grid-template-columns: 1fr; }
      .tool { min-height: 245px; }
      .card-art { height: 115px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .tool, .arrow { transition: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="header">
      <a class="brand" href="/" aria-label="Yuanhui 首页"><span class="brand-mark" aria-hidden="true">y</span><span>yuanhui.</span></a>
      <nav class="nav" aria-label="主页导航"><a href="#tools">工具</a></nav>
    </header>

    <main>
      <section id="tools" aria-labelledby="tools-title">
        <div class="section-heading"><h1 id="tools-title">探索工具</h1><span class="section-kicker">Selected tools / 02</span></div>
        <div class="tools">
          <a class="tool tool-dark" href="/stock-similarity/">
            <div class="card-top"><span class="card-number">01 / 02</span><span class="card-type">Pattern</span></div>
            <svg class="card-art" viewBox="0 0 220 130" fill="none" aria-hidden="true">
              <path d="M0 32H220M0 65H220M0 98H220" stroke="#fff" stroke-opacity=".12"/>
              <path d="M0 96l25-13 22 5 27-36 24 15 26-32 24 20 24-19 25 8 23-25" stroke="#c7dfbe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M0 112l25-10 22 2 27-27 24 10 26-22 24 13 24-15 25 7 23-17" stroke="#c7dfbe" stroke-opacity=".4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/>
              <circle cx="220" cy="19" r="4" fill="#e9b883"/>
            </svg>
            <div class="card-bottom"><div><h2>股票走势相似度</h2><p>发现相似的走势</p></div><span class="arrow" aria-hidden="true">↗</span></div>
          </a>
          <a class="tool tool-light" href="/three-down/">
            <div class="card-top"><span class="card-number">02 / 02</span><span class="card-type">Screener</span></div>
            <svg class="card-art" viewBox="0 0 220 130" fill="none" aria-hidden="true">
              <path d="M0 32H220M0 65H220M0 98H220" stroke="#536b55" stroke-opacity=".14"/>
              <path d="M29 22v49M61 35v46M93 48v49M125 54v50M157 66v45M189 57v40" stroke="#8a9d84" stroke-width="2"/>
              <rect x="22" y="33" width="14" height="25" rx="2" fill="#749074"/>
              <rect x="54" y="45" width="14" height="24" rx="2" fill="#749074"/>
              <rect x="86" y="58" width="14" height="26" rx="2" fill="#749074"/>
              <rect x="118" y="63" width="14" height="28" rx="2" fill="#c78258"/>
              <rect x="150" y="74" width="14" height="24" rx="2" fill="#c78258"/>
              <rect x="182" y="67" width="14" height="19" rx="2" fill="#c78258"/>
            </svg>
            <div class="card-bottom"><div><h2>三连阴缩量选股</h2><p>寻找值得关注的形态</p></div><span class="arrow" aria-hidden="true">↗</span></div>
          </a>
        </div>
      </section>
    </main>
    <footer><span>© Yuanhui</span></footer>
  </div>
</body>
</html>
