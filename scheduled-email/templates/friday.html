<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>星期五的心动</title><style>
@keyframes beat{50%{transform:scale(1.14)}}@keyframes confetti{50%{transform:translateY(10px) rotate(12deg)}}.heart{animation:beat 1.8s ease-in-out infinite}.confetti{animation:confetti 2.8s ease-in-out infinite}@media only screen and (max-width:600px){.shell{width:100%!important}.pad{padding:27px 20px!important}}
</style></head>
<body style="margin:0;padding:0;background:#fff1f5;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;color:#5c3040;"><table role="presentation" width="100%" cellspacing="0" cellpadding="0"><tr><td align="center" style="padding:28px 12px;"><table class="shell" role="presentation" width="600" cellspacing="0" cellpadding="0" style="width:600px;max-width:600px;background:#fffdfd;border-radius:28px;overflow:hidden;box-shadow:0 14px 38px rgba(215,80,121,.15);"><tr><td class="pad" style="padding:35px 44px;background:linear-gradient(135deg,#ffc6d6,#ffe9f0 62%,#ffd6c9);text-align:center;"><div class="confetti" style="font-size:25px;text-align:right;">✦ ✧</div><div class="heart" style="font-size:59px;margin:-12px 0 4px;">💗</div><p style="margin:0;color:#b45472;font-size:13px;letter-spacing:2px;">{{today}} · {{weekday}}</p><h1 style="margin:9px 0 0;color:#9e3f60;font-size:30px;">周五快乐，心动不打烊</h1><p style="margin:11px 0 0;color:#b05b75;">把快乐留给即将到来的周末</p></td></tr><tr><td class="pad" style="padding:31px 44px 39px;"><div style="display:block;padding:21px;border-radius:20px;background:#fff0f4;text-align:center;"><p style="margin:0;color:#bc7289;font-size:14px;">我们的心动已经累计</p><p style="margin:7px 0 0;color:#df5e83;font-size:46px;font-weight:800;">{{wedding_days}} 天</p></div><div style="margin-top:19px;padding:20px;border-radius:18px;background:#fff8fa;border:1px solid #ffdce6;"><p style="margin:0;font-size:18px;font-weight:700;">{{weather_icon}} 武汉 {{weather_condition}}</p><p style="margin:9px 0 0;color:#9d7180;font-size:14px;">{{temperature}} · {{feels_like}} · {{temperature_range}}</p><p style="margin:12px 0 0;color:#a54363;font-size:14px;line-height:1.7;">{{weather_advice}}</p></div><div style="margin-top:18px;padding:16px 18px;border-radius:15px;background:#fff2f5;color:#8e5b6d;font-size:14px;line-height:1.7;"><strong>🌙 {{lunar_date}}</strong><br>{{special_day}}</div><p style="margin:25px 0 0;text-align:center;color:#d48ca2;font-size:13px;">今天也要记得：你值得所有偏爱 ♡</p></td></tr></table></td></tr></table></body></html>
