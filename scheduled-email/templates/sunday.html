<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>星期日的月光</title><style>
@keyframes moon{50%{transform:translateY(-7px);filter:drop-shadow(0 0 12px #fff)}}@keyframes sparkle{50%{opacity:.25;transform:scale(1.35)}}.moon{animation:moon 4s ease-in-out infinite}.sparkle{animation:sparkle 2.6s ease-in-out infinite}@media only screen and (max-width:600px){.shell{width:100%!important}.pad{padding:27px 20px!important}}
</style></head>
<body style="margin:0;padding:0;background:#eef1ff;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;color:#333b68;"><table role="presentation" width="100%" cellspacing="0" cellpadding="0"><tr><td align="center" style="padding:28px 12px;"><table class="shell" role="presentation" width="600" cellspacing="0" cellpadding="0" style="width:600px;max-width:600px;background:#fdfdff;border-radius:28px;overflow:hidden;box-shadow:0 14px 38px rgba(70,87,157,.17);"><tr><td class="pad" style="padding:35px 44px;background:linear-gradient(135deg,#9aa9e4,#dbe2ff 62%,#c4cdf4);text-align:center;"><div class="sparkle" style="font-size:22px;text-align:right;color:#fff;">✦　✧</div><div class="moon" style="font-size:60px;margin:-14px 0 4px;">🌙</div><p style="margin:0;color:#eef1ff;font-size:13px;letter-spacing:2px;">{{today}} · {{weekday}}</p><h1 style="margin:9px 0 0;color:#fff;font-size:30px;text-shadow:0 2px 6px rgba(58,74,138,.25);">星期日，慢慢充电</h1><p style="margin:11px 0 0;color:#f5f6ff;">把温柔留给今天，也留给明天</p></td></tr><tr><td class="pad" style="padding:31px 44px 39px;"><div style="padding:21px;border-radius:20px;background:#f0f3ff;text-align:center;"><p style="margin:0;color:#7480b2;font-size:14px;">这是我们携手的第</p><p style="margin:7px 0 0;color:#6574bd;font-size:46px;font-weight:800;">{{wedding_days}} <span style="font-size:16px;font-weight:500;">天</span></p></div><div style="margin-top:19px;padding:20px;border-radius:18px;background:#f7f8ff;border:1px solid #e1e5fa;"><p style="margin:0;font-size:18px;font-weight:700;">{{weather_icon}} 武汉 · {{weather_condition}}</p><p style="margin:9px 0 0;color:#737b9e;font-size:14px;">{{temperature}} · {{feels_like}}　{{temperature_range}}</p><p style="margin:12px 0 0;color:#5968a5;font-size:14px;line-height:1.7;">{{weather_advice}}</p></div><div style="margin-top:18px;padding:17px 18px;border-radius:15px;background:#f2f4ff;color:#626c94;font-size:14px;line-height:1.7;"><strong>🌙 {{lunar_date}}</strong><br>{{special_day}}</div><p style="margin:25px 0 0;text-align:center;color:#909bc4;font-size:13px;">晚风会捎来明天，爱会一直在 ♡</p></td></tr></table></td></tr></table></body></html>
