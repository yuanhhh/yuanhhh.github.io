<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>星期四的紫色浪漫</title><style>
@keyframes float{50%{transform:translateY(-10px)}}@keyframes twinkle{50%{opacity:.35;transform:scale(1.4)}}.balloon{animation:float 3.5s ease-in-out infinite}.star{animation:twinkle 2.5s ease-in-out infinite}@media only screen and (max-width:600px){.shell{width:100%!important}.pad{padding:27px 20px!important}}
</style></head>
<body style="margin:0;padding:0;background:#f7f1ff;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;color:#3e3155;"><table role="presentation" width="100%" cellspacing="0" cellpadding="0"><tr><td align="center" style="padding:28px 12px;"><table class="shell" role="presentation" width="600" cellspacing="0" cellpadding="0" style="width:600px;max-width:600px;background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 14px 38px rgba(112,82,164,.16);"><tr><td class="pad" style="padding:34px 44px;background:linear-gradient(135deg,#d9c6ff,#f1e9ff 65%,#ecd8ff);text-align:center;"><div class="star" style="font-size:24px;text-align:left;">✦</div><div class="balloon" style="font-size:58px;margin:-11px 0 4px;">🎈</div><p style="margin:0;color:#795aa6;font-size:13px;letter-spacing:2px;">{{today}} · {{weekday}}</p><h1 style="margin:9px 0 0;color:#5b3e82;font-size:30px;">把浪漫存进今天</h1><p style="margin:11px 0 0;color:#8064a1;">再坚持一下，就快周末啦</p></td></tr><tr><td class="pad" style="padding:31px 44px 39px;"><table role="presentation" width="100%" cellspacing="0" cellpadding="0"><tr><td style="padding:4px 0 18px;border-bottom:1px dashed #d9c9eb;"><span style="font-size:15px;color:#755995;">相伴时光</span><strong style="float:right;font-size:27px;color:#8056b9;">{{wedding_days}} 天</strong></td></tr><tr><td style="padding:20px 0 0;"><p style="margin:0;font-size:18px;font-weight:700;">{{weather_icon}} 武汉 · {{weather_condition}}</p><p style="margin:10px 0 0;color:#796b8d;font-size:14px;">{{temperature}}　{{feels_like}}　｜　{{temperature_range}}</p><p style="margin:12px 0 0;padding:13px 15px;border-radius:14px;background:#f6f0ff;color:#694b8d;font-size:14px;line-height:1.7;">{{weather_advice}}</p></td></tr></table><div style="margin-top:20px;padding:18px;border-radius:17px;background:linear-gradient(135deg,#fbf8ff,#f2eaff);"><p style="margin:0;color:#6b4c91;font-size:14px;font-weight:700;">🌙 {{lunar_date}}</p><p style="margin:8px 0 0;color:#725e88;font-size:14px;line-height:1.7;">{{special_day}}</p></div><p style="margin:25px 0 0;text-align:center;color:#a18ab9;font-size:13px;">宇宙很大，但我的关心准时抵达 ♡</p></td></tr></table></td></tr></table></body></html>
