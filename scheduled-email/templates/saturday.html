<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>星期六的橘子汽水</title><style>
@keyframes bounce{50%{transform:translateY(-9px)}}@keyframes bubble{50%{opacity:.3;transform:translateY(-16px) scale(1.2)}}.orange{animation:bounce 3s ease-in-out infinite}.bubble{animation:bubble 3.5s ease-in-out infinite}@media only screen and (max-width:600px){.shell{width:100%!important}.pad{padding:27px 20px!important}}
</style></head>
<body style="margin:0;padding:0;background:#fff7ec;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;color:#563a26;"><table role="presentation" width="100%" cellspacing="0" cellpadding="0"><tr><td align="center" style="padding:28px 12px;"><table class="shell" role="presentation" width="600" cellspacing="0" cellpadding="0" style="width:600px;max-width:600px;background:#fffefa;border-radius:28px;overflow:hidden;box-shadow:0 14px 38px rgba(213,133,48,.15);"><tr><td class="pad" style="padding:35px 44px;background:linear-gradient(135deg,#ffcf8d,#fff1ce 63%,#ffdcad);text-align:center;"><div class="bubble" style="font-size:21px;text-align:left;">○　◦</div><div class="orange" style="font-size:58px;margin:-10px 0 4px;">🍊</div><p style="margin:0;color:#af6c2d;font-size:13px;letter-spacing:2px;">{{today}} · {{weekday}}</p><h1 style="margin:9px 0 0;color:#934d20;font-size:30px;">周末开启，甜度满格</h1><p style="margin:11px 0 0;color:#a96937;">愿今天像橘子汽水一样冒泡</p></td></tr><tr><td class="pad" style="padding:31px 44px 39px;"><table role="presentation" width="100%" cellspacing="0" cellpadding="0"><tr><td style="padding:19px 21px;border-radius:18px;background:#fff5e3;"><span style="color:#a46b3c;font-size:14px;">相伴记录</span><strong style="float:right;color:#e58435;font-size:28px;">{{wedding_days}} 天</strong></td></tr></table><div style="margin-top:19px;padding:20px;border-radius:18px;background:#fffaf1;"><p style="margin:0;font-size:18px;font-weight:700;">{{weather_icon}} 今日武汉 · {{weather_condition}}</p><p style="margin:9px 0 0;color:#926f50;font-size:14px;">{{temperature}}　{{feels_like}}　{{temperature_range}}</p><p style="margin:12px 0 0;color:#9b5527;font-size:14px;line-height:1.7;">{{weather_advice}}</p></div><div style="margin-top:18px;padding:17px 18px;border-radius:15px;background:#fff5e9;color:#886246;font-size:14px;line-height:1.7;"><strong>🌙 {{lunar_date}}</strong><br>{{special_day}}</div><p style="margin:25px 0 0;text-align:center;color:#c58b58;font-size:13px;">周末不赶路，去感受路吧 ♡</p></td></tr></table></td></tr></table></body></html>
