<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>三连阴缩量选股</title>
  <style>
    :root { --ink:#172229; --muted:#647179; --paper:#f3f1e9; --panel:#fffef9; --line:#d4dcd3; --accent:#087464; --danger:#a52e2e; --shadow:0 18px 40px #203d3520; } * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:radial-gradient(circle at 4% 0,#d8eee5,transparent 27rem),radial-gradient(circle at 100% 0,#fae0cd,transparent 25rem),var(--paper); font:16px/1.5 ui-rounded,"PingFang SC","Microsoft YaHei",sans-serif; } main { max-width:1240px; margin:auto; padding:42px 22px 70px; } .head { display:grid; grid-template-columns:1fr auto; gap:24px; align-items:end; margin-bottom:28px; } .eyebrow { margin:0 0 8px; color:var(--accent); font-size:.75rem; font-weight:900; letter-spacing:.14em; text-transform:uppercase; } h1 { margin:0; font-family:Georgia,"Songti SC",serif; font-size:clamp(2.7rem,6vw,5rem); line-height:.92; letter-spacing:-.07em; } .intro { max-width:680px; color:var(--muted); } .back { padding:10px 15px; border:1px solid var(--line); border-radius:999px; color:var(--ink); background:#fffefa; font-size:.84rem; font-weight:800; text-decoration:none; } .back:hover { color:var(--accent); } .layout { display:grid; grid-template-columns:minmax(0,430px) minmax(0,1fr); gap:24px; align-items:start; } .panel { border:1px solid var(--line); border-radius:22px; background:#fffefaeb; box-shadow:var(--shadow); } form { position:sticky; top:18px; padding:25px; } h2 { margin:0 0 18px; font-size:1.28rem; } h3 { margin:24px 0 10px; font-size:1rem; } label { display:block; margin:15px 0 7px; color:#38514d; font-size:.74rem; font-weight:900; letter-spacing:.04em; text-transform:uppercase; } input,select,button { width:100%; border-radius:12px; font:inherit; } input,select { min-height:43px; padding:10px 11px; border:1px solid #c8d3ca; background:#fbfcf8; color:var(--ink); } input:focus,select:focus { outline:3px solid #bce4d8; border-color:var(--accent); background:white; } .help,.notice,.foot { color:var(--muted); font-size:.8rem; } .help { margin:6px 0 0; } .modes,.two { display:grid; gap:10px; } .modes { grid-template-columns:repeat(3,1fr); } .modes label { margin:0; padding:10px 5px; border:1px solid #c8d3ca; border-radius:12px; background:#fbfcf8; cursor:pointer; font-size:.8rem; text-align:center; text-transform:none; } .modes input,.check { width:auto; min-height:0; margin-right:4px; accent-color:var(--accent); } .two { grid-template-columns:1fr 1fr; } details { margin-top:20px; border-top:1px solid var(--line); padding-top:13px; } summary { cursor:pointer; color:#38514d; font-weight:900; } button { margin-top:23px; padding:14px; border:0; background:linear-gradient(135deg,#087464,#15937e); box-shadow:0 10px 20px #08746435; color:white; cursor:pointer; font-weight:900; } button:disabled { background:#89938f; cursor:wait; } .results { min-height:590px; padding:28px; overflow:hidden; } .empty { display:grid; min-height:500px; place-content:center; color:var(--muted); text-align:center; } .empty strong { color:var(--ink); font-size:1.3rem; } .status { display:none; margin-bottom:20px; padding:12px 14px; border:1px solid #9cd0c2; border-radius:13px; background:#e8f4ef; color:#07584d; } .status.show { display:block; } .status.error { border-color:#dda5a0; background:#f8e9e7; color:var(--danger); } .meta { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; } .meta div { padding:12px; border:1px solid var(--line); border-radius:13px; background:#f8f9f4; } .meta span { display:block; color:var(--muted); font-size:.67rem; font-weight:900; text-transform:uppercase; } .meta b { overflow-wrap:anywhere; } .table { margin:0 -28px; padding:0 28px 4px; overflow-x:auto; } table { width:100%; min-width:700px; border-collapse:collapse; font-size:.84rem; } th,td { padding:10px 8px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; } th { color:var(--muted); font-size:.67rem; text-transform:uppercase; } th:first-child,td:first-child,td:nth-child(2) { text-align:left; } td:first-child { font-weight:900; } .positive { color:var(--accent); font-weight:800; } .negative { color:var(--danger); font-weight:800; } .hidden { display:none!important; } @media(max-width:880px) { main { padding-top:28px; } .head,.layout { display:block; } .back { display:inline-block; margin-top:18px; } form { position:static; margin-bottom:20px; } .results { min-height:400px; } .empty { min-height:280px; } } @media(max-width:520px) { .modes,.two,.meta { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main>
    <header class="head"><div><p class="eyebrow">GitHub Actions Stock Screener</p><h1>三连阴<br>缩量选股</h1><p class="intro">扫描 A 股连续三日收跌、成交量递减的形态，支持近期选股、历史回测和自定义交易模拟。</p></div><a class="back" href="/">&larr; 返回主页</a></header>
    <section class="layout">
      <form id="form" class="panel" novalidate>
        <h2>设置扫描条件</h2>
        <label for="token">GitHub Fine-grained Token</label><input id="token" type="password" autocomplete="off" placeholder="github_pat_..."><p class="help">仅保留在当前页面内存中。需要本仓库的 Actions 读写和 Contents 读取权限。</p>
        <label>执行模式</label><div class="modes"><label><input type="radio" name="cmd" value="recent" checked>近期扫描</label><label><input type="radio" name="cmd" value="hist">历史回测</label><label><input type="radio" name="cmd" value="sim">交易模拟</label></div>
        <div id="dates" class="two hidden"><div><label for="start">起始交易日 *</label><input id="start" type="date"></div><div id="endBox"><label for="end">结束交易日 *</label><input id="end" type="date"></div></div><p id="dateHelp" class="help hidden"></p>
        <div id="sim" class="two hidden"><div><label for="take">涨幅达标 (%)</label><input id="take" type="number" step="any" value="5"></div><div><label for="trail">回落止盈 (%)</label><input id="trail" type="number" step="any" value="2"></div><div><label for="stop">回落止损 (%)</label><input id="stop" type="number" min="0" step="any" value="2"></div><div><label for="hold">最长持有日</label><input id="hold" type="number" min="1" step="1" value="5"></div><div><label for="fee">双边费率 (%)</label><input id="fee" type="number" min="0" step="any" value="0"></div></div>
        <details><summary>可选扫描参数</summary><div class="two"><div><label for="top">展示条数</label><input id="top" type="number" min="1" step="1" placeholder="脚本默认值"></div><div><label for="workers">并发数</label><input id="workers" type="number" min="1" step="1" value="8"></div><div><label for="source">行情源</label><select id="source"><option value="auto">自动</option><option value="sina">新浪</option><option value="tencent">腾讯</option></select></div><div><label for="limit">扫描前 N 只</label><input id="limit" type="number" min="0" step="1" value="0"></div><div><label for="count">每只 K 线数</label><input id="count" type="number" min="4" step="1" placeholder="脚本默认值"></div><div><label for="per_day">每日取前 N</label><input id="per_day" type="number" min="0" step="1" placeholder="脚本默认值"></div><div><label for="out">结果 CSV 文件名</label><input id="out" pattern="[A-Za-z0-9._-]+\.csv" placeholder="可选，例如 hits.csv"></div><div><label for="min_decline">3日跌幅下限 (%)</label><input id="min_decline" type="number" step="any" value="-6"></div><div><label for="max_decline">3日跌幅上限 (%)</label><input id="max_decline" type="number" step="any" value="0"></div><div><label for="w_shrink">缩量权重</label><input id="w_shrink" type="number" min="0" step="any" value="0.5"></div><div><label for="w_decline">跌幅权重</label><input id="w_decline" type="number" min="0" step="any" value="0.4"></div></div><label><input id="refresh" class="check" type="checkbox">忽略当日缓存，重新抓取行情</label><p class="help">留空的参数不会传入脚本，因此沿用脚本默认值。</p></details>
        <button id="submit" type="submit">启动 GitHub Actions 扫描</button>
      </form>
      <section class="panel results" aria-live="polite"><div id="status" class="status"></div><div id="empty" class="empty"><div><strong>等待一次扫描</strong><br>任务会在 GitHub Actions 中运行，完成后在此展示结果。</div></div><div id="result" hidden></div></section>
    </section><p class="foot">研究工具，不构成投资建议。盘中成交量不完整，缩量条件以收盘数据为准。</p>
  </main>
  <script>
    const OWNER="yuanhhh", REPO="yuanhhh.github.io", WORKFLOW="three-down.yml", BRANCH="master";
    const form=document.querySelector("#form"), submit=document.querySelector("#submit"), status=document.querySelector("#status"), empty=document.querySelector("#empty"), result=document.querySelector("#result"), value=(id)=>document.querySelector(`#${id}`).value.trim(), mode=()=>document.querySelector('input[name="cmd"]:checked').value;
    const fields=["top","workers","source","limit","count","per_day","out","min_decline","max_decline","w_shrink","w_decline","take","trail","stop","hold","fee"];
    const esc=(v)=>String(v??"-").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c])); const pct=(v)=>v===""||v==null?"-":`${Number(v).toFixed(2)}%`; const cls=(v)=>Number(v)>0?"positive":Number(v)<0?"negative":"";
    function message(text,type="") { status.textContent=text; status.className=`status show ${type}`; }
    function setMode() { const m=mode(), dated=m!=="recent"; document.querySelector("#dates").classList.toggle("hidden",!dated); document.querySelector("#dateHelp").classList.toggle("hidden",!dated); document.querySelector("#endBox").classList.toggle("hidden",m!=="sim"); document.querySelector("#sim").classList.toggle("hidden",m!=="sim"); document.querySelector("#dateHelp").textContent=m==="hist"?"起始日必填；结束日可选，留空表示仅回测该起始日。":"起始日和结束日均为必填。"; }
    function headers(token) { return {Accept:"application/vnd.github+json",Authorization:`Bearer ${token}`,"X-GitHub-Api-Version":"2022-11-28"}; }
    async function api(url,token,options={}) { const res=await fetch(url,{...options,headers:{...headers(token),...options.headers}}); if(!res.ok) { const data=await res.json().catch(()=>({})); throw new Error(data.message||`GitHub API 返回 ${res.status}`); } return res.status===204?null:res.json(); }
    function id() { return `three-down-${new Date().toISOString().replace(/[-:.TZ]/g,"")}-${crypto.randomUUID().slice(0,8)}`; }
    function table(rows,cols) { return `<div class="table"><table><thead><tr>${cols.map(c=>`<th>${c.label}</th>`).join("")}</tr></thead><tbody>${rows.map(row=>`<tr>${cols.map(c=>{const raw=row[c.key],shown=c.format?c.format(raw):esc(raw);return `<td class="${c.className?c.className(raw):""}">${shown}</td>`}).join("")}</tr>`).join("")||`<tr><td colspan="${cols.length}">没有满足条件的结果。</td></tr>`}</tbody></table></div>`; }
    function show(payload,runUrl) { const rows=payload.rows||[], common=[{key:"name",label:"名称"},{key:"code",label:"代码"}]; let title,cols; if(payload.command==="recent") { title=`近期命中 ${rows.length} 只`; cols=[...common,{key:"price",label:"收盘价",format:v=>Number(v).toFixed(3)},{key:"pct3",label:"当日",format:pct,className:cls},{key:"ret3",label:"3日跌幅",format:pct,className:cls},{key:"vol_shrink",label:"缩量",format:pct},{key:"score",label:"得分",format:v=>Number(v).toFixed(4)}]; } else if(payload.command==="hist") { title=`历史命中 ${rows.length} 条`; cols=[{key:"start",label:"起始日"},...common,{key:"ret3",label:"3日跌幅",format:pct,className:cls},{key:"vol_shrink",label:"缩量",format:pct},{key:"score",label:"得分",format:v=>Number(v).toFixed(4)},{key:"gap",label:"次日缺口",format:pct,className:cls},{key:"f1",label:"1日",format:pct,className:cls},{key:"f3",label:"3日",format:pct,className:cls},{key:"f5",label:"5日",format:pct,className:cls}]; } else { title=`模拟交易 ${rows.length} 笔`; cols=[{key:"signal",label:"信号日"},...common,{key:"entry",label:"买入价",format:v=>Number(v).toFixed(3)},{key:"ret3",label:"3日跌幅",format:pct,className:cls},{key:"reason",label:"卖出原因"},{key:"exit_day",label:"卖出日"},{key:"hold",label:"持有日"},{key:"ret",label:"收益",format:pct,className:cls}]; } result.innerHTML=`<div class="meta"><div><span>模式</span><b>${esc(payload.command)}</b></div><div><span>结果文件</span><b>${esc(payload.output)}</b></div><div><span>结果数量</span><b>${rows.length}</b></div></div><p class="notice">${esc(payload.summary||"")}</p><h3>${title}</h3>${table(rows,cols)}<p class="notice">${runUrl?`<a href="${esc(runUrl)}" target="_blank" rel="noreferrer">查看 GitHub Actions 日志</a>`:""}</p>`; empty.hidden=true; result.hidden=false; }
    async function getResult(token,requestId) { const path=encodeURIComponent(`three-down/results/${requestId}.json`), data=await api(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}?ref=${BRANCH}`,token); const bytes=Uint8Array.from(atob(data.content.replace(/\n/g,"")),c=>c.charCodeAt(0)); return JSON.parse(new TextDecoder().decode(bytes)); }
    async function wait(token,requestId,started) { let runUrl=""; for(let i=0;i<180;i++) { const runs=await api(`https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}/runs?event=workflow_dispatch&per_page=10`,token); const run=runs.workflow_runs.find(x=>new Date(x.created_at)>=started); if(run) { runUrl=run.html_url; message(run.status==="completed"?"任务完成，正在读取结果...":`GitHub Actions 正在运行：${run.status}...`); } else message("任务已提交，等待 GitHub Actions 接收..."); try { const payload=await getResult(token,requestId); if(payload.status==="error") throw new Error(payload.message||"任务执行失败。"); show(payload,runUrl); message("扫描完成。","success"); return; } catch(error) { if(run?.status==="completed"&&run.conclusion!=="success") throw new Error(`工作流执行失败。请查看日志：${runUrl}`); if(i===179) throw new Error("等待结果超时，请稍后重试。"); await new Promise(resolve=>setTimeout(resolve,4000)); } } }
    form.addEventListener("submit",async event=>{ event.preventDefault(); try { const token=value("token"),cmd=mode(),start=value("start"),end=value("end"); if(!token) throw new Error("请填写 GitHub Token。"); if((cmd==="hist"||cmd==="sim")&&!start) throw new Error("历史回测和交易模拟必须填写起始交易日。"); if(cmd==="sim"&&!end) throw new Error("交易模拟必须填写结束交易日。"); if(cmd==="sim"&&start>end) throw new Error("起始交易日不能晚于结束交易日。"); if(value("min_decline")&&value("max_decline")&&Number(value("min_decline"))>Number(value("max_decline"))) throw new Error("3日跌幅下限不能大于上限。"); if(value("out")&&!/^[A-Za-z0-9._-]+\.csv$/i.test(value("out"))) throw new Error("结果文件名必须是安全的 .csv 文件名。"); const inputs={cmd}; fields.forEach(key=>{if(cmd!=="sim"&&["take","trail","stop","hold","fee"].includes(key))return;const v=value(key);if(v)inputs[key]=v;}); if(start)inputs.start=start;if(end)inputs.end=end;if(document.querySelector("#refresh").checked)inputs.refresh="true"; const requestId=id(),started=new Date();submit.disabled=true;empty.hidden=true;result.hidden=true;message("正在提交 GitHub Actions 任务...");await api(`https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}/dispatches`,token,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({ref:BRANCH,inputs:{request_id:requestId,...inputs}})});await wait(token,requestId,started); } catch(error) { message(error.message,"error"); } finally { submit.disabled=false; } }); document.querySelectorAll('input[name="cmd"]').forEach(x=>x.addEventListener("change",setMode));setMode();
  </script>
</body>
</html>
