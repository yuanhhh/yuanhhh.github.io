name: Market Turnover
run-name: 行情查询 / ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique request ID generated by the page
        required: true
        type: string

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch market turnover
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          [[ "$REQUEST_ID" =~ ^volume-[0-9]{17}-[0-9a-f]{8}$ ]] || { echo "Invalid request ID" >&2; exit 1; }
          python market-volume/fetch_volume.py --request-id "$REQUEST_ID" --output "market-volume/results/$REQUEST_ID.json"
      - name: Publish result
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "market-volume/results/$REQUEST_ID.json"
          git commit -m "market turnover result $REQUEST_ID"
          for attempt in 1 2 3; do
            git pull --rebase origin master
            if git push origin HEAD:master; then exit 0; fi
          done
          echo "Could not publish result after three attempts" >&2
          exit 1
