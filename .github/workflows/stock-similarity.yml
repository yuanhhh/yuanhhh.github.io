name: Stock Similarity Search

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique request ID generated by the web page
        required: true
        type: string
      ticker:
        description: Target Yahoo Finance ticker
        required: true
        type: string
      start:
        description: Target start date (YYYY-MM-DD, inclusive)
        required: true
        type: string
      end:
        description: Target end date (YYYY-MM-DD, inclusive)
        required: true
        type: string
      threshold:
        description: Minimum composite similarity score (0-100)
        required: true
        default: "95"
        type: string
      mode:
        description: Candidate search mode
        required: true
        default: recent
        type: choice
        options:
          - recent
          - historical
      top:
        description: Maximum number of returned matches
        required: true
        default: "20"
        type: string
      universe:
        description: Comma-separated Yahoo Finance ticker universe
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: stock-similarity-results
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: stock-similarity/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r stock-similarity/requirements.txt

      - name: Run similarity search
        id: search
        continue-on-error: true
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          TICKER: ${{ inputs.ticker }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          THRESHOLD: ${{ inputs.threshold }}
          MODE: ${{ inputs.mode }}
          TOP: ${{ inputs.top }}
          UNIVERSE: ${{ inputs.universe }}
        run: |
          python stock-similarity/similar_trends.py \
            --request-id "$REQUEST_ID" \
            --ticker "$TICKER" \
            --start "$START" \
            --end "$END" \
            --threshold "$THRESHOLD" \
            --mode "$MODE" \
            --top "$TOP" \
            --universe "$UNIVERSE" \
            --output "stock-similarity/results/$REQUEST_ID.json"

      - name: Store failure result
        if: steps.search.outcome == 'failure'
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          path = f"stock-similarity/results/{os.environ['REQUEST_ID']}.json"
          if not os.path.exists(path):
              with open(path, "w", encoding="utf-8") as result:
                  json.dump({
                      "status": "error",
                      "message": "The search workflow failed before it could produce a result. Open the workflow run for details.",
                      "completed_at": datetime.now(timezone.utc).isoformat(),
                      "matches": [],
                  }, result, ensure_ascii=False, indent=2)
          PY

      - name: Commit result
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "stock-similarity/results/$REQUEST_ID.json"
          git commit -m "stock search result $REQUEST_ID"
          git pull --rebase origin master
          git push origin HEAD:master

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: stock-similarity-${{ inputs.request_id }}
          path: stock-similarity/results/${{ inputs.request_id }}.json
          retention-days: 7
