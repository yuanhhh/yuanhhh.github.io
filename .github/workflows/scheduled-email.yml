name: Scheduled Email

on:
  schedule:
    # Every day at 08:35 in China Standard Time.
    - cron: "35 8 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate settings and message without sending an email
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: scheduled-email
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scheduled-email/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r scheduled-email/requirements.txt
      - name: Send scheduled email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_SUBJECT: ${{ secrets.MAIL_SUBJECT }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          SMTP_STARTTLS: ${{ secrets.SMTP_STARTTLS }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scheduled-email/send_email.py --dry-run
          else
            python scheduled-email/send_email.py
          fi
